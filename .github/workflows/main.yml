name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies & Convert Excel to SQLite
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblldb-dev libffi-dev zlib1g-dev python3-dev libjpeg-dev aidl autoconf libtool pkg-config zlib1g
        pip install --upgrade pip setuptools
        pip install "cython==0.29.33" buildozer pandas openpyxl

        # Excel faylni avtomatik baza.db (SQLite) ga o'tkazish
        python3 -c "
        import pandas as pd
        import sqlite3
        import os

        excel_file = '2-TB ZIP platalar 31.07.2025.xlsx'
        if os.path.exists(excel_file):
            df = pd.read_excel(excel_file)
            df = df.fillna('')
            conn = sqlite3.connect('baza.db')
            df.to_sql('platalar', conn, if_exists='replace', index=False)
            conn.close()
            print('baza.db muvaffaqiyatli yaratildi!')
        else:
            print('Excel fayl topilmadi!')
        "

    - name: Create buildozer.spec and Build APK
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Ombor
        package.name = ombor
        package.domain = org.test
        source.dir = .
        source.include_exts = py,png,jpg,dotenv,txt,csv,db
        version = 0.1
        requirements = python3,kivy,sqlite3
        orientation = portrait
        fullscreen = 0
        android.permissions = READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE
        android.api = 33
        android.minapi = 21
        android.accept_sdk_license = True
        android.archs = arm64-v8a

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ombor-apk
        path: bin/*.apk
